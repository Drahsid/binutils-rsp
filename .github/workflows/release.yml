name: Release RSP assembler

on:
  push: { tags: ['v*'] }

permissions: { contents: read }

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04,     asset: rsp-as-linux-x86_64 }
          - { runner: ubuntu-22.04-arm, asset: rsp-as-linux-arm64 }
          - { runner: macos-15-intel,   asset: rsp-as-macos-x86_64, deployment_target: '10.13' }
          - { runner: macos-15,         asset: rsp-as-macos-arm64,  deployment_target: '11.0' }
          - { runner: windows-2022,     asset: rsp-as-windows-x86_64.exe, shell: 'msys2 {0}' }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    steps:
      - if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make diffutils flex bison mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-zlib
      - name: Build rsp-as
        env:
          ASSET: ${{ matrix.asset }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          CFLAGS: -O2 -std=gnu17
          LDFLAGS: ${{ runner.os != 'macOS' && '--static' || '' }}
        run: |
          set -e
          mkdir build
          cd build
          ../configure --target=mips-linux-gnu --disable-gdb --disable-shared --disable-nls --disable-werror \
            --with-system-zlib --without-zstd
          make -j4 all-gas MAKEINFO=true
          strip -o "../$ASSET" gas/as-new*
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --force --sign - "../$ASSET"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum rsp-as-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" rsp-as-* SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes "Prebuilt RSP assemblers."
